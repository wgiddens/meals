# Runs the same four checks as docs/ARCHITECTURE.md "Running checks" on every
# pull request and on every push to main. A PR must be green before merging.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR cancels the run it supersedes. Pushes to main are
# never cancelled, so every commit on main keeps its own result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No DATABASE_URL and no ANTHROPIC_API_KEY on purpose. Without DATABASE_URL
    # the build's migrate step is a no-op and smoke + build use the embedded
    # PGlite database, so CI needs no services and no secrets.
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Node 26 is the Active LTS line (since 2026-10-28) and is what Vercel
          # builds this project on, so CI and production run the same major.
          node-version: 26
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Smoke
        run: npm run smoke

      - name: Build
        run: npm run build
